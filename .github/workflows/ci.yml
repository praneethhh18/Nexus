name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  # Cancel in-progress runs on the same ref. Saves CI minutes when commits
  # arrive in quick succession (e.g. a series of pushes during dev).
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Defaults — keep individual jobs lean.
defaults:
  run:
    shell: bash

env:
  PYTHONDONTWRITEBYTECODE: "1"
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Backend — full pip install + ruff lint + complete pytest run.
  # The pytest.ini default `addopts = -m "not integration"` auto-skips tests
  # marked @pytest.mark.integration (those need a live Ollama). Everything
  # else runs. Cache is keyed on requirements.txt + requirements-dev.txt so
  # routine commits get a ~30s install instead of a 6-minute one.
  # ─────────────────────────────────────────────────────────────────────────
  backend:
    # Python 3.12 — pinned to match Dockerfile (python:3.12-slim) and the
    # Ubuntu 24 LTS default. Bumping it is a deliberate change: update here,
    # the Dockerfile, and the import-smoke job below in the same PR so dev,
    # CI, and prod never drift apart.
    name: Backend (Python 3.12)
    runs-on: ubuntu-latest
    env:
      PY_VERSION: "3.12"
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PY_VERSION }}
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # PyMuPDF needs binary wheels on CI; --only-binary keeps the build
          # fast and avoids the C-toolchain.
          pip install --only-binary=PyMuPDF PyMuPDF || true
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      - name: Ruff lint
        run: |
          # Lint the Python source — fail the build on real errors but allow
          # style nags to surface as warnings (set `--exit-zero` while we're
          # introducing the linter; flip to fail-mode once the codebase is clean).
          ruff check --exit-zero --output-format=github \
            agents/ api/ config/ memory/ orchestrator/ rag/ \
            report_generator/ sql_agent/ tools/ utils/ workflows/ \
            voice/ action_tools/

      - name: Run pytest
        env:
          DB_PATH: /tmp/nexus_ci.db
        run: |
          # Full suite. Pytest auto-skips @pytest.mark.integration tests
          # via pytest.ini addopts. -q for compact output, --tb=short for
          # readable failures, --timeout=60 so a hang doesn't burn 10min.
          python -m pytest tests/ -q --tb=short --timeout=60

      - name: Privacy Bridge smoke test
        env:
          DB_PATH: /tmp/nexus_pb_smoke.db
        run: |
          # Self-contained smoke for the Privacy Bridge wiring. Spins up a
          # FakeOllama HTTP server in-process and exercises invoke + stream
          # forwarders, model auto-pick, and graceful fall-through on down.
          python -m scripts.smoke_privacy_bridge

      - name: Upload pytest output on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: pytest-py${{ env.PY_VERSION }}-logs
          path: |
            .pytest_cache
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # API server import smoke — makes sure routers wire up without a runtime
  # error before the frontend tries to talk to them. Catches missing deps
  # like the `cryptography` / `email-validator` we hit recently.
  # ─────────────────────────────────────────────────────────────────────────
  import-smoke:
    name: API import smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            requirements.txt

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install --only-binary=PyMuPDF PyMuPDF || true
          pip install -r requirements.txt

      - name: Import api.server
        env:
          DB_PATH: /tmp/nexus_smoke.db
        run: |
          python -c "
          from api.server import app
          paths = {r.path for r in app.routes}
          print(f'OK: {len(paths)} unique routes registered')
          # Sanity: a handful of routes that should always exist.
          for p in ['/api/whatsapp/inbound', '/api/privacy/usage',
                    '/api/agent/chat', '/api/auth/login']:
              assert p in paths, f'missing route: {p}'
          print('All sentinel routes present.')
          "

  # ─────────────────────────────────────────────────────────────────────────
  # Frontend — eslint + production Vite build.
  # `npm ci` enforces the lockfile; we fall back to `npm install` only when
  # the lockfile is genuinely out of sync (a rare cross-platform quirk).
  # ─────────────────────────────────────────────────────────────────────────
  frontend:
    name: Frontend (build + lint)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install
        run: npm ci || npm install --no-audit --no-fund

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run build

      - name: Upload dist artifact
        uses: actions/upload-artifact@v5
        with:
          name: frontend-dist
          path: frontend/dist
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Landing — separate Vite app, simple build check.
  # ─────────────────────────────────────────────────────────────────────────
  landing:
    name: Landing (build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: landing
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: landing/package-lock.json
      - name: Install
        run: npm ci || npm install --no-audit --no-fund
      - name: Build
        run: npm run build

  # ─────────────────────────────────────────────────────────────────────────
  # WhatsApp bridge — install + node --check (catches import / syntax errors
  # before they reach a running service).
  # ─────────────────────────────────────────────────────────────────────────
  whatsapp-bridge:
    name: WhatsApp bridge (syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: whatsapp_bridge
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: whatsapp_bridge/package-lock.json
      - name: Install
        run: npm ci || npm install --no-audit --no-fund
      - name: Syntax check
        run: node --check server.js

  # ─────────────────────────────────────────────────────────────────────────
  # Privacy Bridge installer (Electron) — install + parse-check every JS
  # file we ship inside the installer. Catches typos / missing braces before
  # they reach a customer's laptop, where a parse error means a tray app
  # that silently does nothing.
  # ─────────────────────────────────────────────────────────────────────────
  privacy-bridge-installer:
    name: Privacy Bridge installer (syntax)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: privacy_bridge_installer
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: privacy_bridge_installer/package-lock.json
      - name: Install (lockfile only — no Electron runtime needed for syntax)
        # `--ignore-scripts` skips electron's postinstall (~150MB download)
        # and any native rebuilds. Pure metadata install is enough for the
        # parse check below.
        run: npm ci --ignore-scripts || npm install --no-audit --no-fund --ignore-scripts
      - name: Syntax check
        run: |
          # node --check on every shipped file. Skips bin/ (cloudflared
          # binary), node_modules/, dist/.
          for f in main.js preload.js tray.js tunnel.js ollama.js \
                   settings.js setup.js bridge.js; do
            echo "Checking $f"
            node --check "$f"
          done

  # ─────────────────────────────────────────────────────────────────────────
  # E2E — Playwright against the Vite dev server. Heavier, runs only if
  # frontend build passes (`needs: [frontend]`).
  # ─────────────────────────────────────────────────────────────────────────
  e2e:
    name: E2E (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install
        run: npm ci || npm install --no-audit --no-fund
      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium
      - name: Run E2E suite
        run: npx playwright test
        env:
          CI: "true"
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: |
            frontend/playwright-report
            frontend/test-results
          retention-days: 7

  # ─────────────────────────────────────────────────────────────────────────
  # Secrets scan — catches accidental commits of API keys, tokens, etc.
  # before they hit the public history. Runs against the diff for PRs and
  # the full tree on push.
  # ─────────────────────────────────────────────────────────────────────────
  secrets-scan:
    name: Secrets scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # Need full history so gitleaks can scan the diff range on PRs.
          fetch-depth: 0
      - name: Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ─────────────────────────────────────────────────────────────────────────
  # Build summary — final fan-in. Always runs, depends on every other job,
  # writes a Mermaid flowchart to the run summary so the GitHub UI shows a
  # node graph of which jobs ran and their result instead of a flat list.
  #
  # Also acts as a single "all-green" gate: branch protection can require
  # just this one job's status instead of nine separate checks.
  # ─────────────────────────────────────────────────────────────────────────
  summary:
    name: CI summary
    runs-on: ubuntu-latest
    if: always()
    needs:
      - backend
      - import-smoke
      - frontend
      - landing
      - whatsapp-bridge
      - privacy-bridge-installer
      - e2e
      - secrets-scan
    steps:
      - name: Render Mermaid flowchart to job summary
        env:
          R_BACKEND:    ${{ needs.backend.result }}
          R_IMPORT:     ${{ needs.import-smoke.result }}
          R_FRONTEND:   ${{ needs.frontend.result }}
          R_LANDING:    ${{ needs.landing.result }}
          R_WA:         ${{ needs.whatsapp-bridge.result }}
          R_PB:         ${{ needs.privacy-bridge-installer.result }}
          R_E2E:        ${{ needs.e2e.result }}
          R_SECRETS:    ${{ needs.secrets-scan.result }}
        run: |
          # Map job result -> Mermaid class (CSS-style colored nodes)
          cls() {
            case "$1" in
              success)   echo "ok" ;;
              failure)   echo "bad" ;;
              cancelled) echo "skip" ;;
              skipped)   echo "skip" ;;
              *)         echo "unk" ;;
            esac
          }

          {
            echo "## CI run graph"
            echo ""
            echo "\`\`\`mermaid"
            echo "flowchart LR"
            echo "  classDef ok fill:#10B981,stroke:#065F46,color:#fff"
            echo "  classDef bad fill:#EF4444,stroke:#7F1D1D,color:#fff"
            echo "  classDef skip fill:#94A3B8,stroke:#475569,color:#fff"
            echo "  classDef unk fill:#F59E0B,stroke:#92400E,color:#fff"
            echo ""
            echo "  src([Push / PR]) --> backend[Backend + smoke]"
            echo "  src --> import[API import smoke]"
            echo "  src --> frontend[Frontend]"
            echo "  src --> landing[Landing]"
            echo "  src --> wa[WhatsApp bridge]"
            echo "  src --> pb[Privacy Bridge installer]"
            echo "  src --> sec[Secrets scan]"
            echo "  frontend --> e2e[E2E Playwright]"
            echo "  backend --> done([CI summary])"
            echo "  import --> done"
            echo "  e2e --> done"
            echo "  landing --> done"
            echo "  wa --> done"
            echo "  pb --> done"
            echo "  sec --> done"
            echo ""
            echo "  class backend $(cls "$R_BACKEND")"
            echo "  class import $(cls "$R_IMPORT")"
            echo "  class frontend $(cls "$R_FRONTEND")"
            echo "  class landing $(cls "$R_LANDING")"
            echo "  class wa $(cls "$R_WA")"
            echo "  class pb $(cls "$R_PB")"
            echo "  class e2e $(cls "$R_E2E")"
            echo "  class sec $(cls "$R_SECRETS")"
            echo "\`\`\`"
            echo ""
            echo "| Job | Result |"
            echo "|---|---|"
            echo "| Backend (Python 3.12) + Privacy Bridge smoke | $R_BACKEND |"
            echo "| API import smoke | $R_IMPORT |"
            echo "| Frontend (build + lint) | $R_FRONTEND |"
            echo "| Landing (build) | $R_LANDING |"
            echo "| WhatsApp bridge (syntax) | $R_WA |"
            echo "| Privacy Bridge installer (syntax) | $R_PB |"
            echo "| E2E (Playwright) | $R_E2E |"
            echo "| Secrets scan | $R_SECRETS |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any required job failed
        run: |
          # Single gate: if anything other than success/skipped, fail this job.
          # Branch protection should require only "CI summary" instead of all 8.
          for r in "$R_BACKEND" "$R_IMPORT" "$R_FRONTEND" "$R_LANDING" \
                   "$R_WA" "$R_PB" "$R_E2E" "$R_SECRETS"; do
            case "$r" in
              success|skipped) ;;
              *) echo "::error::A required job concluded as: $r"; exit 1 ;;
            esac
          done
          echo "All required jobs passed."
        env:
          R_BACKEND:    ${{ needs.backend.result }}
          R_IMPORT:     ${{ needs.import-smoke.result }}
          R_FRONTEND:   ${{ needs.frontend.result }}
          R_LANDING:    ${{ needs.landing.result }}
          R_WA:         ${{ needs.whatsapp-bridge.result }}
          R_PB:         ${{ needs.privacy-bridge-installer.result }}
          R_E2E:        ${{ needs.e2e.result }}
          R_SECRETS:    ${{ needs.secrets-scan.result }}
