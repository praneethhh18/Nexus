name: Release

# Triggers:
#   - tag push matching v*.*.*  → real release
#   - workflow_dispatch         → on-demand release for testing
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      version:
        description: "Manual version tag (e.g. v0.3.0)"
        required: true
        default: "v0.0.0"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ─────────────────────────────────────────────────────────────────────────
  # Build a multi-arch Docker image, scan it for known CVEs, then push to
  # GHCR. Failing the scan blocks the push — we'd rather catch a critical
  # CVE before customers pull a vulnerable image than after.
  # ─────────────────────────────────────────────────────────────────────────
  docker:
    name: Build, scan, push Docker image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      security-events: write   # Trivy uploads SARIF results to the Security tab
    steps:
      - uses: actions/checkout@v5

      - name: Derive version
        id: ver
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME}"
          fi
          echo "VERSION=${VERSION#v}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build (load locally for scan)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          # Single-arch build first; we load it into the local Docker so
          # Trivy can inspect it. The multi-arch push happens below after
          # the scan passes.
          platforms: linux/amd64
          load: true
          tags: nexusagent:scan
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Trivy CVE scan
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: nexusagent:scan
          format: sarif
          output: trivy-results.sarif
          # Don't fail on LOW/MEDIUM — those are noise. Block CRITICAL
          # so a known-bad base image can't slip through.
          severity: CRITICAL,HIGH
          exit-code: "1"
          ignore-unfixed: true

      - name: Upload Trivy SARIF to Security tab
        if: always()
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: trivy-results.sarif

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push (multi-arch)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ steps.ver.outputs.VERSION }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─────────────────────────────────────────────────────────────────────────
  # Privacy Bridge Windows installer — builds the NSIS .exe with cloudflared
  # bundled, then uploads it as a release asset. Once published, the
  # /settings/privacy-mode download button (which points at
  # github.com/.../releases/latest/download/...) just works for customers
  # without any manual upload step.
  # ─────────────────────────────────────────────────────────────────────────
  windows-installer:
    name: Build Windows installer
    runs-on: windows-latest
    if: startsWith(github.ref, 'refs/tags/')
    permissions:
      contents: write
    defaults:
      run:
        working-directory: privacy_bridge_installer
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: privacy_bridge_installer/package-lock.json

      - name: Install npm deps
        run: npm ci || npm install --no-audit --no-fund

      - name: Download cloudflared.exe to bundle
        run: |
          # electron-builder copies bin/${os}/${arch}/* into the installer's
          # resources/bin/ at package time. ${os} = "win" (electron-builder's
          # name), NOT Node's "win32".
          mkdir -p bin/win/x64
          curl -L --fail -o bin/win/x64/cloudflared.exe \
            https://github.com/cloudflare/cloudflared/releases/latest/download/cloudflared-windows-amd64.exe
          ls -la bin/win/x64/cloudflared.exe

      - name: Build NSIS installer
        run: npm run dist:win
        env:
          # electron-builder reads this when uploading; we don't actually
          # publish here (handled by github-release job below), so disable.
          GH_TOKEN: ""

      - name: Rename artifact for stable download URL
        # The default filename includes the version (e.g. "...Setup 0.1.0.exe").
        # We also produce a version-less alias so the Settings page can link to
        # /releases/latest/download/NexusAgent-Privacy-Bridge-Setup.exe forever.
        run: |
          src=$(ls dist/*Setup*.exe | head -1)
          cp "$src" "dist/NexusAgent-Privacy-Bridge-Setup.exe"
          ls -la dist/

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v5
        with:
          name: privacy-bridge-windows-installer
          path: |
            privacy_bridge_installer/dist/*.exe
            privacy_bridge_installer/dist/*.exe.blockmap
          retention-days: 30

  # ─────────────────────────────────────────────────────────────────────────
  # Draft a GitHub release with auto-generated notes from the commit history
  # since the previous tag. Marked as a draft so the maintainer reviews
  # before publishing — releases trigger downstream notifications.
  #
  # Pulls the Windows installer artifact from the windows-installer job and
  # attaches it to the release so the Settings page download URL works.
  # ─────────────────────────────────────────────────────────────────────────
  github-release:
    name: Draft GitHub release
    runs-on: ubuntu-latest
    needs: [docker, windows-installer]
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Pull Windows installer artifact
        uses: actions/download-artifact@v5
        with:
          name: privacy-bridge-windows-installer
          path: release-assets/

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: true
          prerelease: ${{ contains(github.ref_name, '-rc') || contains(github.ref_name, '-beta') }}
          files: |
            release-assets/*.exe
            release-assets/*.exe.blockmap

  deploy:
    name: Deploy to EC2
    runs-on: ubuntu-latest
    needs: [docker]
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd /home/ubuntu/NexusAgent
            docker compose pull
            docker compose up -d --remove-orphans
            docker image prune -f
