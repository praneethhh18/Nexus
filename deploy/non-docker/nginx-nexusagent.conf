# Non-Docker nginx config for NexusAgent.
#
# Hosts:
#   nexusagent.in             -> landing/dist
#   www.nexusagent.in         -> landing/dist
#   nexus.nexusagent.in       -> frontend/dist + FastAPI /api and /ws
#   vox.nexusagent.in         -> NexusCaller server on 127.0.0.1:8765
#
# Install:
#   sudo cp deploy/non-docker/nginx-nexusagent.conf /etc/nginx/sites-available/nexusagent
#   sudo ln -s /etc/nginx/sites-available/nexusagent /etc/nginx/sites-enabled/nexusagent
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name nexusagent.in www.nexusagent.in nexus.nexusagent.in vox.nexusagent.in;

    location /.well-known/acme-challenge/ {
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    server_name nexusagent.in www.nexusagent.in;

    ssl_certificate     /etc/letsencrypt/live/nexusagent.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexusagent.in/privkey.pem;

    root /opt/nexusagent/landing/dist;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name nexus.nexusagent.in;

    ssl_certificate     /etc/letsencrypt/live/nexus.nexusagent.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nexus.nexusagent.in/privkey.pem;

    client_max_body_size 60M;

    root /opt/nexusagent/frontend/dist;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /assets/ {
        expires 7d;
        add_header Cache-Control "public, immutable";
    }
}

server {
    listen 443 ssl http2;
    server_name vox.nexusagent.in;

    ssl_certificate     /etc/letsencrypt/live/vox.nexusagent.in/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vox.nexusagent.in/privkey.pem;

    location / {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    location /ws/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }
}
